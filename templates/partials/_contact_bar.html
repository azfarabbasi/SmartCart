<div class="contact-bar">
    <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
        <div class="contact-bar-info">
            <a href="tel:{{ contact_phone }}"><i class="bi bi-telephone-fill"></i> {{ contact_phone }}</a>
            <a href="mailto:{{ contact_email }}"><i class="bi bi-envelope-fill"></i> {{ contact_email }}</a>
        </div>
        <div class="contact-bar-whatsapp">
            <a href="https://wa.me/{{ whatsapp_number }}" target="_blank" rel="noopener">
                <i class="bi bi-whatsapp"></i> For any help or query contact at WhatsApp: +{{ whatsapp_number }}
            </a>
        </div>
    </div>
</div>
