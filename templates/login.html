{% extends "auth_base.html" %}
{% block title %}SmartCart - Sign In{% endblock %}
{% block content %}
    <h1>Sign In</h1>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input-wrapper">
                <input type="password" id="password" name="password" class="form-control" required>
                <button type="button" class="password-toggle">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-warning btn-auth">Sign In</button>
    </form>

    <div class="auth-divider">
        <span>New to SmartCart?</span>
    </div>

    <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary btn-auth">Create your SmartCart account</a>

    <div class="auth-terms">
        <p>By continuing, you agree to SmartCart's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>
    </div>
{% endblock %}
