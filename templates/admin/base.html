<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Admin - SmartCart{% endblock %}</title>
    <link href="{{ url_for('static', filename='dist/app.css') }}?v={{ asset_version }}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="admin-body">
    {% include 'partials/_sidebar_admin.html' %}
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="admin-main">
        <header class="admin-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <h1>{% block page_title %}Admin{% endblock %}</h1>
            </div>
            <div class="header-right">
                <div class="admin-user">
                    <i class="bi bi-person-circle"></i>
                    <span>{{ current_user.name }}</span>
                </div>
            </div>
        </header>

        <main class="admin-content">
            {% include 'partials/_flash_messages.html' %}
            {% block content %}{% endblock %}
        </main>
    </div>

    <script defer src="{{ url_for('static', filename='dist/app.js') }}?v={{ asset_version }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
